[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalscope-ext"
version = "0.1.0"
description = "Benchmark pruning and encoder probe extensions for evalscope"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pydantic>=2.6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]
evalscope = ["evalscope>=1.0.0"]

[project.scripts]
evalscope-compare-runs = "evalscope_ext.tools.compare_runs:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evalscope_ext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
